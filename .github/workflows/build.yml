name: Build APK

# يبني APK تلقائياً على خوادم GitHub عند كل Push، أو يدوياً من تبويب Actions.
# الناتج يظهر كملف قابل للتنزيل في صفحة كل تشغيل (Artifacts).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        # التطبيق داخل مجلد app/ ويعتمد على ../backend عبر path dependency
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze (non-blocking)
        # تحذيرات التحليل لا توقف البناء، لكنها تظهر في السجل للمراجعة
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sellaoui-engai-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
